<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Halaman Nilai</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#43e97b,#38f9d7);
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      width:450px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      color:#333;
    }

    .item{
      margin-bottom:18px;
      padding:15px;
      background:#f5f5f5;
      border-radius:10px;
    }

    .label{
      font-weight:bold;
      color:#007bff;
      margin-bottom:5px;
    }

    .name{
      color:#333;
      font-size:17px;
    }

    .back{
      display:block;
      margin-top:25px;
      text-align:center;
      text-decoration:none;
      background:#007bff;
      color:white;
      padding:12px;
      border-radius:10px;
      transition:0.3s;
      font-weight:bold;
    }

    .back:hover{
      background:#0056b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Halaman Nilai</h1>

    <div class="item">
      <div class="label">Nama Owner</div>
      <div class="name">Mustaqimah Dwi Susilo</div>
    </div>

    <div class="item">
      <div class="label">Nama Kolaborator 1</div>
      <div class="name">Zasky Najwa Safa</div>
    </div>

    <div class="item">
      <div class="label">Nama Kolaborator 2</div>
      <div class="name">Rana Kusuma</div>
    </div>

    <a href="index.html" class="back">
      Kembali ke Beranda
    </a>
  </div>

</body>
</html>
