<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Beranda</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{
      background:white;
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      width:350px;
    }

    h1{
      margin-bottom:15px;
      color:#333;
    }

    p{
      color:#666;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:12px 25px;
      background:#007bff;
      color:white;
      text-decoration:none;
      border-radius:10px;
      transition:0.3s;
      font-weight:bold;
    }

    .btn:hover{
      background:#0056b3;
      transform:scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Halaman Beranda</h1>
    <p>Selamat datang di website sederhana.</p>

    <a href="nilai.html" class="btn">
      Ke Halaman Nilai
    </a>
  </div>

</body>
</html>
